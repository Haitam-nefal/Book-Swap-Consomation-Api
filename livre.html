<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Livre</title>
</head>

<body>

    <header class="bg-gray-400 fixed w-full shadow-lg z-90" id="navbar">

    </header>

    <main class="max-w-6xl mx-auto py-25">

        <div class="mb-10 border-3 border-black rounded-lg flex items-center px-2">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" name="search_input" id="search_input" placeholder="Titre de Livre"
                class="outline-none min-w-full px-3">
        </div>

        <section>
            <header></header>
            <!-- Spinner -->
            <div class="text-center min-h-30 flex justify-center items-center" id="loader">
                <i class="fa-solid fa-spinner animate-spin"></i>
            </div>
            <div id="affichage_books" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- AFFICHAGE BOOK -->
            </div>
        </section>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/livre.js" type="module"></script>
</body>

</html>
