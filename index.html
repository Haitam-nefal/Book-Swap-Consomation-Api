<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>BookSwap</title>
</head>

<body>

    <header class="bg-gray-400 fixed w-full shadow-lg z-90" id="navbar">
        <!--  -->
    </header>



    <main class="max-w-6xl mx-auto">
        <section class="py-25">
            <form id="rechreche" class="grid grid-cols-3 gap-5 bg-gray-300 shadow-lg mx-2 py-1 px-3">
                <div class="border-3 border-black max-h-fit rounded-md">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="input_rechreche" placeholder="Titre du Livre..." class="outline-none">
                </div>
                <div>
                    <h4 class="text-[20px] font-semibold">Type d'echange</h4>
                    <div>
                        <label for="tous">Tous</label>
                        <input type="checkbox" name="tous" id="tous">
                    </div>
                    <div>
                        <label for="tous">Definitive</label>
                        <input type="checkbox" name="" id="">
                    </div>
                    <div>
                        <label for="tous">Temporaire</label>
                        <input type="checkbox" name="" id="">
                    </div>
                </div>
                <div>
                    <h4 class="text-[20px] font-semibold">Categorie</h4>
                    <select name="categorie" id="categories">
                        <!-- <option value="">test</option>
                        <option value="">test</option>
                        <option value="">test</option>
                        <option value="">test</option> -->
                    </select>
                </div>
                <button class="bg-red-600 rounded-lg text-white py-1 px-3 cursor-pointer block min-w-full"
                    type="submit">Actualiser</button>
            </form>


            <div>
                <header class="my-10">
                    <h1 class="text-[30px] font-bold">Demande d'echange de Livre</h1>
                    <p class="text-[17px] font-semibold max-w-[60%]">Lorem ipsum dolor sit amet consectetur, adipisicing
                        elit. Porro, recusandae.</p>
                </header>

                <!-- Spinner -->
                <div class="text-center min-h-30 flex justify-center items-center" id="loader">
                    <i class="fa-solid fa-spinner animate-spin"></i>
                </div>
                <!-- Affichage Books -->
                <div id="demande_dechange" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <!-- ARTICLE -->
                </div>

            </div>


        </section>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/index.js" type="module"></script>
</body>

</html>
